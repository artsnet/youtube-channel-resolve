name: Release

# Publishes to npm when a version tag is pushed (v0.1.0), or by hand from the Actions tab.
#
# Preferred path: npm Trusted Publishing (OIDC). On npmjs.com, in the package's settings, add a
# trusted publisher for GitHub Actions with this repository and the workflow file "release.yml".
# No secret is needed then. Until that is configured, the fallback step publishes with the
# NPM_TOKEN secret (a granular access token with read/write on @artsnet and 2FA bypass).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use an npm that supports trusted publishing (11.5.1 or newer)
        run: npm install -g npm@^11 && npm --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check that the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected" || { echo "tag $GITHUB_REF_NAME does not match package version $expected"; exit 1; }
      - name: Publish with trusted publishing (OIDC)
        id: oidc
        continue-on-error: true
        run: npm publish --access public --provenance
      - name: Publish with NPM_TOKEN (fallback until trusted publishing is configured)
        if: steps.oidc.outcome == 'failure'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "Trusted publishing failed and NPM_TOKEN is not set."; exit 1; }
          echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm publish --access public --provenance
      - name: Report
        run: echo "published via ${{ steps.oidc.outcome == 'success' && 'trusted publishing (OIDC)' || 'NPM_TOKEN fallback' }}"
